name: Probe wiki
on:
  workflow_dispatch:
    inputs:
      pages: { description: "titles separated by |", default: "" }
      cats: { description: "categories separated by |", default: "" }
      chars: { description: "chars per page", default: "3000" }
      skip: { description: "skip first N chars", default: "0" }
      urls: { description: "name=>url=>chars=>skip separated by ;;", default: "" }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts_probe.py
        env:
          PAGES: ${{ inputs.pages }}
          CATS: ${{ inputs.cats }}
          CHARS: ${{ inputs.chars }}
          SKIP: ${{ inputs.skip }}
          URLS: ${{ inputs.urls }}
