# «Сервер» бота на GitHub Actions: каждые ~5 минут стартует задача, которая ~5.5 минут
# держит long polling Telegram (ответы почти мгновенные) и рассылает уведомления.
name: Telegram bot
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write   # чтобы запустить следующий цикл бота
concurrency:
  group: bot            # одновременно работает один экземпляр, следующий ждёт в очереди
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Restore state (branch bot-state)
        env:
          TOKEN: ${{ github.token }}
        run: |
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$URL" bot-state >/dev/null 2>&1; then
            git clone --depth 1 --branch bot-state "$URL" state
          else
            mkdir state && cd state && git init -q -b bot-state && git remote add origin "$URL"
          fi
      - name: Run bot
        id: bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: python -m msm.cli run-bot --seconds 330 --state state/state.bin
      - name: Save state
        if: always()
        run: |
          cd state
          git config user.name "msm-tracker[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -q -m "state" && git push -q origin bot-state; }
      # Эстафета: после успешного цикла сразу запускаем следующий (cron GitHub бывает с большими задержками).
      # workflow_dispatch от GITHUB_TOKEN запуск создаёт; очередь concurrency не даёт циклам пересекаться.
      # При ошибке бота эстафета не продолжается (нет «горячего» цикла) — остаётся cron.
      - name: Relay next cycle
        if: steps.bot.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --ref main
