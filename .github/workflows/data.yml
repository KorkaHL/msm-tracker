# Автообновление данных из вики + публикация сайта на GitHub Pages.
name: Update data & deploy site
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "config/**", "msm/**"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t .
      - name: Fetch events from wiki
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: python -m msm.cli update-data
      - name: Commit data
        run: |
          git config user.name "msm-tracker[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.json
          if git diff --cached --quiet; then echo "no changes"; else
            # generated_at меняется каждый раз — коммитим только если изменились события
            git commit -m "data: update events [skip ci]" && git push
          fi
      - name: Build site
        run: |
          mkdir -p _site && cp site/* _site/ && cp data/events.json _site/events.json
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
